name: Verify

# PR 门禁：版本一致性 + Dockerfile 静态检查 + 镜像冒烟。
# 分支保护只要求 `verify` 这一个聚合 check，矩阵内部增删版本都不会影响保护规则。

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # commit subject 门禁要对比 base…head，浅克隆会让该范围为空；
          # 仓库很小，直接全量拉取。
          fetch-depth: 0
          # 本 job 不推送，无需把 token 写进 git config
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      # 离线校验：versions.json / 每个 Dockerfile 的 FROM / README 表格行是否一致
      - name: Check version consistency
        run: yarn sync:check

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: '**/Dockerfile'
          recursive: true
          config: .hadolint.yaml

      - name: Lint Markdown
        run: |
          set -euo pipefail
          corepack enable
          yarn install --frozen-lockfile
          yarn lint:md

      # Commit subjects and PR titles must stay English: release tooling and CI
      # logs assume ASCII, and mixed scripts make the log hard to scan.
      # PR title 也要查：本仓库用 squash 合并，落地后的 subject 就是 PR 标题。
      - name: Lint commit subject language
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          cjk='/[\x{2e80}-\x{9fff}\x{ff00}-\x{ffef}]/'
          failed=0

          # 仅统计本 PR 新增的 commit，不回看历史
          range="${BASE_SHA}..${HEAD_SHA}"
          echo "checking $range"
          offenders=$(git log --format='%h%x09%s' "$range" \
            | perl -CSD -ne "print if $cjk" || true)
          if [ -n "$offenders" ]; then
            echo "::error::commit subject 含中文，请改为英文"
            printf '%s\n' "$offenders"
            failed=1
          fi

          if printf '%s' "$PR_TITLE" | perl -CSD -ne "print if $cjk" \
            | grep -q .; then
            echo "::error::PR 标题含中文，请改为英文：$PR_TITLE"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "::error::提交信息必须为英文（见 AGENTS.md）"
            exit 1
          fi
          echo "✅ commit subject / PR 标题均为 ASCII"

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.5'
            dir: '8.5'
            autotools: true
          - php: '8.4'
            dir: '8.4'
            autotools: true
          - php: '8.3'
            dir: '8.3'
            autotools: true
          # eol/8.2 未带 autotools，标记缺省，断言会自动跳过。
          - php: '8.2'
            dir: 'eol/8.2'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # 只构建本机架构，验证 Dockerfile 能跑通，不推任何 tag
      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.dir }}
          load: true
          tags: smoke:${{ matrix.php }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify PHP and extensions
        run: |
          set -euo pipefail
          image=smoke:${{ matrix.php }}
          extensions='redis imagick bcmath intl gd pdo_mysql pdo_pgsql zip soap'

          docker run --rm "$image" php -v

          # 先把模块列表完整取到变量：直接接 grep -q 会让 php -m 收到 SIGPIPE，
          # 导致无规律的 "write /dev/stdout: broken pipe" 误报缺扩展。
          modules=$(docker run --rm "$image" php -m)
          missing=''
          for ext in $extensions; do
            if ! printf '%s\n' "$modules" | grep -qx "$ext"; then
              missing="$missing $ext"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::缺少 PHP 扩展:${missing}"
            printf '%s\n' "$modules"
            exit 1
          fi
          echo "✅ 扩展齐全: $extensions"

      - name: Verify bundled tools
        run: |
          set -euo pipefail
          image=smoke:${{ matrix.php }}
          docker run --rm "$image" composer --version
          docker run --rm "$image" phpcs --version
          docker run --rm "$image" pint --version
          docker run --rm "$image" node --version

      # 只有 8.3/8.4/8.5 自带 GNU Autotools（供构建期编译 gifsicle 等原生模块，
      # 见上游 PR #109）；eol/8.2 不在范围内，靠 matrix.autotools 跳过。
      - name: Verify GNU Autotools
        if: matrix.autotools
        run: |
          set -euo pipefail
          image=smoke:${{ matrix.php }}
          docker run --rm "$image" autoreconf --version
          docker run --rm "$image" automake --version

  # 聚合门禁：分支保护只认这一个 check，避免矩阵 job 改名后保护失效。
  verify:
    name: verify
    if: always()
    needs:
      - consistency
      - smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check upstream results
        env:
          CONSISTENCY: ${{ needs.consistency.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          set -euo pipefail
          echo "consistency: $CONSISTENCY"
          echo "smoke: $SMOKE"

          if [ "$CONSISTENCY" != "success" ] || [ "$SMOKE" != "success" ]; then
            echo "::error::上游检查未全部通过"
            exit 1
          fi

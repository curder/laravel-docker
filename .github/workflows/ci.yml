name: Verify

# PR 门禁：版本一致性 + Dockerfile 静态检查 + 镜像冒烟。
# 分支保护只要求 `verify` 这一个聚合 check，矩阵内部增删版本都不会影响保护规则。

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # commit subject 门禁要对比 base…head，浅克隆会让该范围为空；
          # 仓库很小，直接全量拉取。
          fetch-depth: 0
          # 本 job 不推送，无需把 token 写进 git config
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      # 离线校验：versions.json / 每个 Dockerfile 的 FROM / README 表格行是否一致
      - name: Check version consistency
        run: yarn sync:check

      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: '**/Dockerfile'
          recursive: true
          config: .hadolint.yaml

      - name: Lint Markdown
        run: |
          set -euo pipefail
          corepack enable
          yarn install --frozen-lockfile
          yarn lint:md

      # gitlab/ 下的示例不被其他任何检查覆盖：它们既不是 Dockerfile，也不在
      # GitHub Actions 的运行路径上，很容易随生态演进悄悄写成过时写法。
      - name: Lint YAML
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check \
            yamllint==1.37.1
          yamllint --strict .github/workflows/ gitlab/ .yamllint.yaml

      # Commit subjects and PR titles must stay English: release tooling and CI
      # logs assume ASCII, and mixed scripts make the log hard to scan.
      # PR title 也要查：本仓库用 squash 合并，落地后的 subject 就是 PR 标题。
      # push 到 master 也要查，否则直接推送 / 机器人推送能绕过门禁。
      - name: Lint commit subject language
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          cjk='/[\x{2e80}-\x{9fff}\x{ff00}-\x{ffef}]/'
          failed=0

          # 40 个 0 表示新分支，无法确定可比较范围
          null_sha=0000000000000000000000000000000000000000

          if [ "$EVENT_NAME" = 'pull_request' ]; then
            # 只看本 PR 新增的 commit，不回看历史
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [ -n "${BEFORE_SHA:-}" ] \
            && [ "$BEFORE_SHA" != "$null_sha" ]; then
            # push：只看本次推送引入的 commit（squash 后的 subject 也在这里）
            range="${BEFORE_SHA}..${AFTER_SHA}"
          else
            # 新建分支 / 无 before 的推送，无法确定范围，跳过
            echo 'no comparable range; skipping'
            exit 0
          fi

          echo "checking $range"
          offenders=$(git log --format='%h%x09%s' "$range" \
            | perl -CSD -ne "print if $cjk" || true)
          if [ -n "$offenders" ]; then
            echo "::error::commit subject 含中文，请改为英文"
            printf '%s\n' "$offenders"
            failed=1
          fi

          if [ -n "${PR_TITLE:-}" ] && \
             printf '%s' "$PR_TITLE" | perl -CSD -ne "print if $cjk" \
               | grep -q .; then
            echo "::error::PR 标题含中文，请改为英文：$PR_TITLE"
            failed=1
          fi

          if [ "$failed" -ne 0 ]; then
            echo "::error::提交信息必须为英文（见 AGENTS.md）"
            exit 1
          fi
          echo "✅ commit subject / PR 标题均为 ASCII"

  smoke:
    # 显式命名：矩阵新增键（如 autotools）时不会改变 check 名。
    name: smoke (${{ matrix.php }}, ${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.5'
            dir: '8.5'
            autotools: true
            pcov: true
            pint: true
          - php: '8.4'
            dir: '8.4'
            autotools: true
            pcov: true
            pint: true
          - php: '8.3'
            dir: '8.3'
            autotools: true
            pcov: true
            pint: true
          # eol/8.2 未带 autotools / pcov，标记缺省，断言会自动跳过。
          - php: '8.2'
            dir: 'eol/8.2'
            pint: true
          # EOL 分支以前只在 push 到 master 时被构建，坏了没人知道：2026-10 就因
          # 基础镜像自带的 PEAR 读不动 pecl.php.net 的 channel.xml，7.1~7.4 与
          # 8.1 全部构建失败，而 PR 门禁一直是绿的。
          - php: '8.1'
            dir: 'eol/8.1'
            pint: true
          - php: '8.0'
            dir: 'eol/8.0'
          - php: '7.4'
            dir: 'eol/7.4'
          - php: '7.3'
            dir: 'eol/7.3'
          - php: '7.2'
            dir: 'eol/7.2'
          - php: '7.1'
            dir: 'eol/7.1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # 只构建本机架构，验证 Dockerfile 能跑通，不推任何 tag
      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.dir }}
          load: true
          tags: smoke:${{ matrix.php }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify PHP and extensions
        run: |
          set -euo pipefail
          image=smoke:${{ matrix.php }}
          extensions='redis imagick bcmath intl gd pdo_mysql pdo_pgsql zip soap'

          docker run --rm "$image" php -v

          # 先把模块列表完整取到变量：直接接 grep -q 会让 php -m 收到 SIGPIPE，
          # 导致无规律的 "write /dev/stdout: broken pipe" 误报缺扩展。
          modules=$(docker run --rm "$image" php -m)
          missing=''
          for ext in $extensions; do
            if ! printf '%s\n' "$modules" | grep -qx "$ext"; then
              missing="$missing $ext"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::缺少 PHP 扩展:${missing}"
            printf '%s\n' "$modules"
            exit 1
          fi
          echo "✅ 扩展齐全: $extensions"

      - name: Verify bundled tools
        run: |
          set -euo pipefail
          image=smoke:${{ matrix.php }}
          docker run --rm "$image" composer --version
          docker run --rm "$image" phpcs --version
          # Laravel Pint 需要 PHP >= 8.1，7.x 与 8.0 只装了 phpcs。
          if [ "${{ matrix.pint }}" = 'true' ]; then
            docker run --rm "$image" pint --version
          fi
          docker run --rm "$image" node --version

      # 只有 8.3/8.4/8.5 自带 GNU Autotools（供构建期编译 gifsicle 等原生模块，
      # 见上游 PR #109）；eol/8.2 不在范围内，靠 matrix.autotools 跳过。
      - name: Verify GNU Autotools
        if: matrix.autotools
        run: |
          set -euo pipefail
          image=smoke:${{ matrix.php }}
          docker run --rm "$image" autoreconf --version
          docker run --rm "$image" automake --version

      # pcov 用于生成覆盖率（比 xdebug 快，见上游 PR #112）。它与 xdebug
      # 可以共存：默认 xdebug.mode=develop，覆盖率驱动不会被 xdebug 抢占。
      - name: Verify PCOV
        if: matrix.pcov
        run: |
          set -euo pipefail
          image=smoke:${{ matrix.php }}

          modules=$(docker run --rm "$image" php -m)
          printf '%s\n' "$modules" | grep -qx pcov \
            || { echo '::error::pcov 扩展缺失'; exit 1; }

          # 只验「装上了」不够，还要能真正采集到覆盖率数据。
          docker run --rm "$image" php -d pcov.enabled=1 -r '
            pcov\start();
            $x = 1 + 1;
            pcov\stop();
            $c = pcov\collect();
            if (!is_array($c)) {
              fwrite(STDERR, "pcov collect failed\n");
              exit(1);
            }
            echo "pcov ok\n";
          '

  # 聚合门禁：分支保护只认这一个 check，避免矩阵 job 改名后保护失效。
  verify:
    name: verify
    if: always()
    needs:
      - consistency
      - smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check upstream results
        env:
          CONSISTENCY: ${{ needs.consistency.result }}
          SMOKE: ${{ needs.smoke.result }}
        run: |
          set -euo pipefail
          echo "consistency: $CONSISTENCY"
          echo "smoke: $SMOKE"

          if [ "$CONSISTENCY" != "success" ] || [ "$SMOKE" != "success" ]; then
            echo "::error::上游检查未全部通过"
            exit 1
          fi

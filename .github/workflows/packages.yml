name: Build and publish packages

# 版本矩阵来自 versions.json（由 sync-php.yml 维护），push 到 master 时发布镜像。
# 同一个 dir 下的多个 tag（如 latest / stable / 8.5.11）会复用 buildx 的 gha 缓存，
# 只有第一项真正执行编译，其余项命中缓存后只需重新导出层。

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: packages
  cancel-in-progress: false

env:
  IMAGE: curder/laravel-docker

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 单个 dir 一个矩阵项，tags 以列表形式传入，避免同 context 重复构建
      - name: Build matrix from versions.json
        id: matrix
        run: |
          set -euo pipefail
          matrix=$(jq -c '
            group_by(.dir)
            | map({
                php: .[0].php,
                dir: .[0].dir,
                tags: [.[] | .tags[]]
              })
          ' versions.json)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "${matrix}" | jq .

  docker:
    needs: versions
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # EOL 镜像构建失败不应该取消其他版本发布
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.versions.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Ali Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_DOCKER_USERNAME }}
          password: ${{ secrets.ALIYUN_DOCKER_TOKEN }}

      # 把 tags 数组展开成三个 registry 的全部 tag
      - name: Compose image tags
        id: tags
        env:
          TAGS: ${{ join(matrix.tags, ' ') }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/tags.txt"
          for tag in $TAGS; do
            {
              echo "ghcr.io/${IMAGE}:${tag}"
              echo "${IMAGE}:${tag}"
              echo "registry.cn-hangzhou.aliyuncs.com/${IMAGE}:${tag}"
            } >> "$RUNNER_TEMP/tags.txt"
          done
          {
            echo "tags<<TAGS_EOF"
            cat "$RUNNER_TEMP/tags.txt"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          context: ${{ matrix.dir }}
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.dir }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dir }}

# Example GitLab CI pipeline: build, test and deploy a Laravel application.
# Copy this file into your Laravel project as `.gitlab-ci.yml`.
image: curder/laravel-docker:stable

stages:
  - build
  - test
  - deploy

# SSH agent setup, shared by the deploy jobs.
.init_ssh: &init_ssh |
  eval $(ssh-agent -s)
  if [ -z "${SSH_PRIVATE_KEY:-}" ]; then
    echo "SSH_PRIVATE_KEY is not set" >&2
    exit 1
  fi
  echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
  mkdir -p ~/.ssh
  chmod 700 ~/.ssh
  # Prefer pinning the host key over disabling verification:
  #   ssh-keyscan yourdomain.com >> ~/.ssh/known_hosts
  #   chmod 644 ~/.ssh/known_hosts
  # Disabling verification makes the deploy vulnerable to MITM, so only do it
  # for throwaway environments.
  ssh-keyscan yourdomain.com >> ~/.ssh/known_hosts
  chmod 644 ~/.ssh/known_hosts

.change_file_permissions: &change_file_permissions |
  find . -type f -not -path "./vendor/*" -exec chmod 664 {} \;
  find . -type d -not -path "./vendor/*" -exec chmod 775 {} \;

composer:
  stage: build
  cache:
    key: ${CI_COMMIT_REF_SLUG}-composer
    paths:
      - vendor/
  script:
    - composer install --prefer-dist --no-ansi --no-interaction --no-progress --no-scripts
    - cp .env.example .env
    - php artisan key:generate
  # vendor/ and .env are build outputs, not long-lived artifacts: pass them to
  # later jobs through the cache instead of 1-month artifacts.
  artifacts:
    expire_in: 1 day
    paths:
      - vendor/
      - .env

npm:
  stage: build
  cache:
    key: ${CI_COMMIT_REF_SLUG}-npm
    paths:
      - node_modules/
  script:
    # Pick the line matching your frontend toolchain:
    #   Laravel 9+ / Vite  -> npm run build
    #   Laravel 8 / Mix    -> npm run production
    - npm ci
    - npm run build
  artifacts:
    expire_in: 1 week
    paths:
      - public/build/
      # For Laravel Mix projects use public/css/ and public/js/ instead.

codestyle:
  stage: test
  dependencies: []
  script:
    # helphelpers.php 不是类文件，跳过它
    - >-
      phpcs --standard=PSR12 --extensions=php
      --ignore=app/Support/helpers.php app

phpunit:
  stage: test
  dependencies:
    - composer
  script:
    - phpunit --coverage-text --colors=never

staging:
  stage: deploy
  script:
    - *init_ssh
    - *change_file_permissions
    - php artisan deploy dev.yourdomain.com -s upload
  environment:
    name: staging
    url: http://dev.yourdomain.com
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

production:
  stage: deploy
  script:
    - *init_ssh
    - *change_file_permissions
    - php artisan deploy yourdomain.com -s upload
  environment:
    name: production
    url: http://yourdomain.com
  rules:
    # Keep production a manual gate, as before.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
